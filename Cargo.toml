[package]
name = "cpp-pkg"
version = "0.1.0"
edition = "2021"
description = "A C++ package manager and build system that consumes CMake-based dependencies"

[[bin]]
name = "cpp-pkg"
path = "src/main.rs"

[lib]
name = "cppkg"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
blake3 = "1"
hex = "0.4"
sha2 = "0.10"
glob = "0.3"
ureq = "2"
dirs = "5"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
