schema-version = 1

# Migration of https://github.com/voladynamics/vtz (IANA-timezone library)
# pinned at main commit 8d6ea8f35ed18fb72b9796a1d9a843df0529baf0.
#
# Wave-2 edition: uses the wave-1 schema natively ([flags]+cfg,
# [dev-dependencies], test/dev markers + [[run]] entries, [generate]
# incl. checked-in mode, dependency patches, glob !-negation,
# [target-defaults], install/export, the Threads::Threads builtin).
# See README.md / GAPS.md next to this file.
#
# This manifest is literally buildable as checked in (no placeholders):
# pin.sh only stages it, the generator scripts (etc/cppkg/), the absl
# patch, and the fetched tzdata (tzdb-runtime/ — pinned-asset fetch is
# still an aux script; [generate] tier d is deferred by design).

[package]
name = "vtz"
version = "1.1.0"

[export]
cmake-name = "vtz"                  # find_package(vtz)
namespace  = "vtz"                  # vtz::vtz — matches upstream's EXPORT NAMESPACE

# ------------------------------------------------------------------
# Upstream: add_compile_options(...) at top level under
# `if(PROJECT_IS_TOP_LEVEL) if(UNIX)`, plus the global
# CMAKE_CXX_VISIBILITY_PRESET hidden / CMAKE_VISIBILITY_INLINES_HIDDEN ON /
# CMAKE_POSITION_INDEPENDENT_CODE ON presets (driver flags for gcc/clang,
# meaningless to MSVC — narrowest true predicate is `unix`).
# [flags] is hoisted-profile semantics: consumer targets only, all
# profiles — exactly upstream's PROJECT_IS_TOP_LEVEL guard (deps unaffected).
[flags.cfg.unix]
cxx-flags = [
  "-fdiagnostics-color=always",
  "-Werror=uninitialized",
  "-Wunused",
  "-Wimplicit-fallthrough",
  "-Wnarrowing",
  "-Wunused-parameter",
  "-fvisibility=hidden",            # transcribed: CMAKE_CXX_VISIBILITY_PRESET hidden
  "-fvisibility-inlines-hidden",    # transcribed: CMAKE_VISIBILITY_INLINES_HIDDEN ON
  "-fPIC",                          # transcribed: CMAKE_POSITION_INDEPENDENT_CODE ON
]

[flags.cfg.clang]
# transcribed: if(CMAKE_CXX_COMPILER_ID MATCHES "Clang") — upstream also
# nests this under UNIX; cfg has no all(unix, clang) combinator yet, and
# clang alone is the blessed approximation (matches AppleClang).
cxx-flags = ["-Wshorten-64-to-32"]

[flags.cfg.msvc]
# transcribed: elseif(MSVC) add_compile_options(/W4)
cxx-flags = ["/W4"]

# ------------------------------------------------------------------
# Runtime dependencies (reachable from non-dev targets). Upstream vendors
# ankerl inline (etc/3rd/ankerl); per the migration brief we declare the
# real package at the same version as the vendored header.
[dependencies]
fmt = { git = "https://github.com/fmtlib/fmt", tag = "11.2.0" }
unordered_dense = { git = "https://github.com/martinus/unordered_dense", tag = "v4.8.1" }

# ------------------------------------------------------------------
# Dev-dependencies: test/bench-only. A library consumer of this manifest no
# longer builds any of these (wave 1 §3: locked eagerly, fetched/built only
# when a dev target is requested).
[dev-dependencies]
# Key is the user's handle again; find-package carries the CMake name.
googletest = { git = "https://github.com/google/googletest", tag = "v1.17.0", find-package = "GTest" }

# Hinnant date: the reference implementation the tests compare against.
# MANUAL_TZ_DB=ON — no curl/auto-download; tests point it at the same
# extracted tzdata vtz uses (upstream passes the same options via CPM).
# Consumed from the REAL upstream URL now: v3.0.4's headers-exported-via-
# INTERFACE_SOURCES no longer trip the extractor (non-compilable interface
# sources are skipped at extraction since wave 1) — the wave-1 local
# patched clone is gone.
[dev-dependencies.date]
git = "https://github.com/HowardHinnant/date"
tag = "v3.0.4"
options = { BUILD_TZ_LIB = "ON", MANUAL_TZ_DB = "ON" }
# NOTE: no exposes-targets = ["Threads::Threads"] anymore — Threads is a
# builtin pseudo-package since wave 1 (naming-ladder step 0); the four dep
# configs' find_dependency(Threads) dedupe into builtin:threads.

[dev-dependencies.benchmark]
git = "https://github.com/google/benchmark"
tag = "v1.9.4"
options = { BENCHMARK_ENABLE_TESTING = "OFF", BENCHMARK_ENABLE_GTEST_TESTS = "OFF" }

# abseil 20260107.1 (= upstream vtz's exact pin) has a broken install
# export: heterogeneous_lookup_testing lacks TESTONLY (fixed on absl
# master), so find_package(absl) on an installed prefix hard-fails. The
# one-line backport is now a first-class dependency patch — the wave-1
# pin.sh local-clone + file:// + placeholder contraption is gone.
# Upstream builds absl in C++20 mode (ABSL_INTERNAL_AT_LEAST_CXX20 via
# CPM); the supported spelling for an install build is CMAKE_CXX_STANDARD.
[dev-dependencies.absl]
git = "https://github.com/abseil/abseil-cpp"
rev = "255c84dadd029fd8ad25c5efb5933e47beaa00c7"          # tag 20260107.1
patches = ["patches/absl-0001-mark-heterogeneous_lookup_testing-TESTONLY.patch"]
options = { ABSL_ENABLE_INSTALL = "ON", ABSL_PROPAGATE_CXX_STD = "ON", CMAKE_CXX_STANDARD = "20" }

# ------------------------------------------------------------------
# Codegen. The tzdb *fetch* (IANA tarball + pinned windowsZones.xml)
# remains scripts/fetch-tzdata.sh -> tzdb-runtime/ (tier d deferred);
# everything downstream of the fetched bytes is a real [generate] step.
#
# Laziness contract: `cpp-pkg build` (library only) activates NO steps and
# needs no tzdb-runtime/; `cpp-pkg test` activates zoneinfo +
# tzdata-fixture via the run entries' ${gen} references and fails loudly
# (naming the missing input) if fetch-tzdata.sh has not run.

# zic-compiled tzif tree — upstream's add_custom_command(zic -b fat -d ...).
# Tier b can only DECLARE a single stdout output, so the tzif tree itself
# is an undeclared side-effect write under ${gen} and the declared output
# is a stamp (see GAPS.md — Remaining).
[generate.zoneinfo]
command = ["zic", "-b", "fat", "-d", "${gen}/data/zoneinfo", "tzdb-runtime/data/tzdata/tzdata.zi"]
stdout  = "data/zoneinfo.stamp"
inputs  = ["tzdb-runtime/data/tzdata/tzdata.zi"]

# Tests derive BOTH <build>/data/tzdata and <build>/data/zoneinfo from one
# --build root (etc/test/include/test_vtz/test_main.cpp), so the fetched
# tzdata must appear under the same ${gen} root the zic tree lands in —
# upstream's file(CREATE_LINK ... SYMBOLIC), as a step.
[generate.tzdata-fixture]
command = ["python3", "etc/cppkg/stage_tzdata.py", "tzdb-runtime/data/tzdata", "${gen}/data/tzdata"]
stdout  = "data/tzdata.stamp"
inputs  = ["etc/cppkg/stage_tzdata.py", "tzdb-runtime/data/tzdata/tzdata.zi"]

# The two checked-in generated headers (upstream: VTZ_REFRESH_TZDATA).
# `cpp-pkg build` compiles the committed files; `cpp-pkg gen` refreshes
# them; `cpp-pkg gen --check` byte-diffs (replaces wave 1's hand-rolled
# fetch-tzdata.sh --verify-refresh).
[generate.embedded-tzdb-content]
command    = ["python3", "etc/cppkg/gen_embedded_tzdb_content.py"]
stdin      = "tzdb-runtime/data/tzdata/tzdata.zi"
stdout     = "embedded_tzdb_content.h"
inputs     = ["etc/cppkg/gen_embedded_tzdb_content.py"]
checked-in = "include/impl/vtz/embedded_tzdb_content.h"

[generate.known-zones]
command    = ["python3", "etc/cppkg/gen_known_zones.py", "include/impl/vtz/known_zones.h.in"]
stdin      = "tzdb-runtime/data/tzdata/tzdata.zi"
stdout     = "known_zones.h"
inputs     = ["etc/cppkg/gen_known_zones.py", "include/impl/vtz/known_zones.h.in"]
checked-in = "include/impl/vtz/known_zones.h"

# ------------------------------------------------------------------
# Every target is C++17 except vtz_a_guided_tour / bench_vtz (20) — scalar
# defaults fill-if-absent, those two override.
[target-defaults]
cxx-std = 17

# ------------------------------------------------------------------
# Library targets.
#
# Upstream compiles include/api/*.cpp + include/impl/*.cpp ONCE into an
# OBJECT library (vtz_objects) and wraps it twice: `vtz` (public headers =
# include/api only) and `vtz_impl` (internals exposed for tests/bench).
# Still no object-library kind (B11 not in wave 1), so the same sources
# compile twice (see GAPS.md — Remaining).
#
# Per-source property upstream: embedded_tzdb.cpp gets COMPILE_DEFINITIONS
# VTZ_EMBED_TZDB=$<BOOL:...>. Per-source defines are still not expressible;
# VTZ_EMBED_TZDB=1 stays target-wide (safe: only embedded_tzdb.cpp tests
# the macro — verified by grep).
[targets.vtz]
type = "static-library"
sources = ["include/api/**/*.cpp", "include/impl/**/*.cpp"]
includes = { public = ["include/api"], private = ["include/impl"] }
defines = { public = ["VTZ_STATIC_DEFINE"], private = [
  'VTZ_TZDATA_PATH_VARS="VTZ_TZDATA_PATH"',
  "vtz_EXPORTS",
  "VTZ_EMBED_TZDB=1",
] }
dependencies = { private = ["unordered_dense::unordered_dense"] }
# Upstream: install(TARGETS vtz EXPORT vtz FILE_SET HEADERS) — the derived
# public-header rule (everything under includes.public) IS the FILE_SET
# BASE_DIRS include/api split.
install = true

[targets.vtz.cfg.unix]
# transcribed: if(PROJECT_IS_TOP_LEVEL AND UNIX)
# target_compile_options(vtz_objects PRIVATE -Wall -Wextra) — was dropped
# entirely in wave 1 (no per-target flags).
cxx-flags = ["-Wall", "-Wextra"]

[targets.vtz_impl]
type = "static-library"
sources = ["include/api/**/*.cpp", "include/impl/**/*.cpp"]
includes = { public = ["include/impl", "include/api"] }
defines = { public = ["VTZ_STATIC_DEFINE"], private = [
  'VTZ_TZDATA_PATH_VARS="VTZ_TZDATA_PATH"',
  "vtz_EXPORTS",
  "VTZ_EMBED_TZDB=1",
] }
dependencies = { public = ["unordered_dense::unordered_dense"] }

[targets.vtz_impl.cfg.unix]
cxx-flags = ["-Wall", "-Wextra"]    # same vtz_objects-only upstream flags

[targets.vtz_extras]
type = "static-library"
sources = ["include/extras/**/*.cpp"]
includes = { public = ["include/extras"] }
dependencies = { public = ["fmt::fmt", "vtz_impl"] }

# ------------------------------------------------------------------
# Tests (upstream: etc/test — gtest_discover_tests x3 + 4
# add_standalone_test registrations = 774 ctest cases). The whole README
# protocol is now [[run]] entries executed by `cpp-pkg test`.
[targets.vtz_testing]
type = "static-library"
dev  = true
sources = ["etc/test/include/test_vtz/*.cpp"]
includes = { public = ["etc/test/include"], private = ["include/api", "include/impl"] }
dependencies = { public = [
  "date::date",
  "date::date-tz",
  "GTest::gtest",
  "GTest::gmock",
  "fmt::fmt",
] }

[targets.vtz_testing.cfg.windows]
# transcribed: if(WIN32 AND NOT VTZ_BUILD_SHARED) — static flavor is the
# only one this manifest builds.
defines = { private = ["VTZ_STATIC_DEFINE"] }

[targets.test_vtz]
type = "executable"
test = true
sources = ["etc/test/test_impl/*.cpp"]
dependencies = ["vtz_testing", "vtz_extras"]

[targets.test_vtz.cfg.msvc]
# transcribed: if(MSVC) — intentional shadowing in test cases
cxx-flags = ["/wd4456", "/wd4459"]

# upstream: gtest_discover_tests(test_vtz TEST_PREFIX "impl/" EXTRA_ARGS
# --build ${BUILD} --testdata ${VTZ_ROOT}/etc/testdata) — 50 cases
[[targets.test_vtz.run]]
name = "impl"
args = ["--build", "${gen}", "--testdata", "${project-root}/etc/testdata"]

[targets.test_vtz_api]
type = "executable"
test = true
sources = ["etc/test/test_api/*.cpp"]
dependencies = ["vtz_testing", "vtz"]

[targets.test_vtz_api.cfg.msvc]
cxx-flags = ["/wd4456", "/wd4459"]

# upstream TEST_PREFIX "api/" — 360 cases
[[targets.test_vtz_api.run]]
name = "api"
args = ["--build", "${gen}", "--testdata", "${project-root}/etc/testdata"]

# upstream TEST_PREFIX "api_embed/" (VTZ_EMBED_TZDB) — 360 cases
[[targets.test_vtz_api.run]]
name = "api-embed"
args = ["--no_set_install", "--build", "${gen}", "--testdata", "${project-root}/etc/testdata"]

# Standalone tests: the add_standalone_test matrix, 1:1. These point at the
# fetched tzdata directly (they never read zoneinfo), so they stay honest
# under test filtering — see GAPS.md on ${gen}-prefix activation vs. stamp
# outputs.
[targets.test_tzdb_load]
type = "executable"
test = true
sources = ["etc/test/standalone/test_tzdb_load.cpp"]
dependencies = ["vtz"]

[[targets.test_tzdb_load.run]]
name = "can-load-from-env"
env  = { VTZ_TZDATA_PATH = "${project-root}/tzdb-runtime/data/tzdata" }

[[targets.test_tzdb_load.run]]
name = "can-load-from-set-install"
args = ["${project-root}/tzdb-runtime/data/tzdata"]
env-remove = ["VTZ_TZDATA_PATH"]     # upstream: ENVIRONMENT_MODIFICATION unset

[[targets.test_tzdb_load.run]]
name = "death-bad-env-path"
env  = { VTZ_TZDATA_PATH = "/bad/env/path" }
expect-failure = true                # upstream: WILL_FAIL TRUE

[[targets.test_tzdb_load.run]]
name = "death-bad-set-install-path"
args = ["/bad/set_install/path"]
env  = { VTZ_TZDATA_PATH = "${project-root}/tzdb-runtime/data/tzdata" }
expect-failure = true

# ------------------------------------------------------------------
# Examples. Upstream generates one exe per file with a foreach-glob; still
# no target templating (minor, recorded).
[targets.vtz_tldr]
type = "executable"
sources = ["examples/src/vtz_tldr.cpp"]
dependencies = ["vtz", "fmt::fmt"]

[targets.vtz_chrono]
type = "executable"
sources = ["examples/src/vtz_chrono.cpp"]
dependencies = ["vtz", "fmt::fmt"]

[targets.vtz_unix_time]
type = "executable"
sources = ["examples/src/vtz_unix_time.cpp"]
dependencies = ["vtz", "fmt::fmt"]

[targets.vtz_a_guided_tour]
type = "executable"
sources = ["examples/src/vtz_a_guided_tour.cpp"]
cxx-std = 20                          # upstream: uses C++20 chrono aliases
dependencies = ["vtz", "fmt::fmt"]

# Tool (upstream: etc/tools foreach-glob).
[targets.dump_tzfile]
type = "executable"
sources = ["etc/tools/dump_tzfile.cpp"]
dependencies = ["vtz_extras", "fmt::fmt"]

# ------------------------------------------------------------------
# Bench. dev (not test — the label would lie). Upstream globs
# etc/bench/src/*.cpp and REMOVE_ITEMs bench_date_with_os_tzdb.cpp unless
# VTZ_ALSO_BENCH_HINNANT_OS_TZDB: the wave-1 7-file list is now the glob
# with a !-negation (= the OFF configuration; the ON variant still needs
# per-source -U/-D flags and compiles ${date_SOURCE_DIR}/src/tz.cpp out of
# the dep's source tree — still inexpressible, see GAPS.md).
[targets.bench_vtz]
type = "executable"
dev  = true
sources = [
  "etc/bench/src/*.cpp",
  "!etc/bench/src/bench_date_with_os_tzdb.cpp",
]
cxx-std = 20
dependencies = [
  "vtz_impl",
  "benchmark::benchmark",
  "fmt::fmt",
  "date::date-tz",
  "absl::time",
  "absl::time_zone",
]
