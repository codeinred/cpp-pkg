# Upstream cfg-* ctest entries (add_cfg in test/CMakeLists.txt),
# transcribed argv-for-argv; library = declared extra libs + the file's
# own basename, platform default unix64.

[[targets.cppcheck-cfg-test.run]]
name = "cfg-boost_cpp"
args = [
  "--library=boost", "--check-library", "--check-level=exhaustive",
  "--platform=unix64", "--enable=style,information", "--inconclusive",
  "--force", "--error-exitcode=1", "--inline-suppr",
  "--debug-warnings", "--suppress=checkersReport",
  "test/cfg/boost.cpp",
]

