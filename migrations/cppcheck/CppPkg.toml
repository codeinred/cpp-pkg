# cpp-pkg port of cppcheck 2.21.1 — CLI + testrunner (GUI/Qt out of scope).
# Wave-2 edition: rewritten for the wave-1 schema (cfg, [flags], [target-defaults],
# glob "!", runtime-data, install, dev/test + [[run]], system deps, builtins).
#
# Target mapping vs upstream CMake:
#   tinyxml2 (static)        -> [targets.tinyxml2]   (vendored, compiled in-tree)
#   simplecpp (static)       -> [targets.simplecpp]  (vendored, compiled in-tree)
#   picojson (INTERFACE)     -> still no interface-library kind; folded into
#                               consumers' private include dirs (unchanged gap)
#   cppcheck-core (OBJECT)   -> static-library (upstream's OBJECT rationale is
#                               stale in 2.21.x: lib/checks.cpp registers every
#                               check explicitly; verified byte-identical
#                               --errorlist in wave 1)
#   frontend (static)        -> [targets.frontend]
#   cli (static)             -> [targets.cli] — NOW REPRODUCIBLE:
#                               sources = ["cli/*.cpp", "!cli/main.cpp"]
#   cppcheck (exe)           -> [targets.cppcheck] = cli/main.cpp + cli lib,
#                               Threads::Threads builtin, runtime-data staged
#                               at build time (stage-data.sh deleted)
#   testrunner (exe)         -> [targets.testrunner] test = true; 85 [[run]]
#                               entries = upstream's per-fixture ctest set
#   cfg-* ctest entries      -> [targets.cppcheck-cfg-test]: run entries can
#                               only spawn their OWN target's binary, so the
#                               28 cfg tests (which invoke the product binary)
#                               need a duplicate one-TU executable. See GAPS.
#   test/signal, test/seh    -> dev = true helper executables
#   tools/dmake              -> dev = true (EXCLUDE_FROM_ALL upstream);
#                               run-dmake's source-tree Makefile refresh has
#                               no [generate] home (output isn't consumed by
#                               this build) — not modeled
#
# Deliberate divergences from upstream defaults (see GAPS.md):
#   - matchcompiler codegen OFF (== -DUSE_MATCHCOMPILER=Off): tier-c
#     per-source transform, still deferred; behavior-identical by upstream's
#     own Verify contract.
#   - Boost is DECLARED (system dep) instead of ambiently auto-detected
#     (== -DUSE_BOOST=On): a Boost-less machine now errors at need-time
#     instead of silently building a slower binary.
#   - FILESDIR points at cpp-pkg's install layout share/cppcheck (upstream:
#     share/Cppcheck) and is baked via ${install-prefix}.
#   - precompiled headers (target_precompile_headers): still no PCH support.
#   - clang's -mllvm -inline-deferral / -gdwarf-4 apply in every profile
#     (upstream: Release/RelWithDebInfo only / clang>=14 only) — profile- or
#     version-conditional flags are not expressible; both are perf/debug-info
#     only.
#   - Debug-profile stdlib hardening (_LIBCPP_HARDENING_MODE / Debug-only
#     _GLIBCXX_DEBUG on libstdc++) is not replicated: platform-conditional
#     defines cannot be profile-scoped ([profiles.*.cfg.*] reserved). This
#     port bakes the Release branch for all profiles.

schema-version = 1

[package]
name = "cppcheck"
version = "2.21.1"

# ------------------------------------------------------------------
# Upstream overrides CMake's Release -O3 with -O2 (compileroptions.cmake,
# GNU|Clang branch). Last-wins over the builtin config flags is contract
# since wave 1.
[profiles.release]
cxx-flags = ["-O2"]

# ------------------------------------------------------------------
# Package flags: upstream's add_compile_options() environment, previously
# unexpressible (wave-1 gap #4).
[flags]
cxx-flags = ["-pedantic"]           # upstream: GNU|Clang (MSVC out of scope)

# transcribed: CMAKE_CXX_COMPILER_ID MATCHES "Clang" branch of
# compileroptions.cmake. -Weverything + curated -Wno list, in upstream order.
# add_compile_options_safe entries were probed against Apple clang 21;
# -Wno-return-std-move-in-c++11 and -Wno-shadow-header are rejected there
# (removed / not yet in Apple's branch) and dropped — cfg has no compiler
# version predicate (reserved).
[flags.cfg.clang]
cxx-flags = [
  "-Weverything",
  "-mllvm", "-inline-deferral",     # transcribed: clang>=14 Release/RWDI perf
                                    # workaround (llvm/llvm-project#53555);
                                    # two argv words, not shell text
  "-gdwarf-4",                      # transcribed: clang>=14 — DWARF4 for
                                    # valgrind-class tools
  "-Wno-sign-conversion",
  "-Wno-shadow-field-in-constructor",
  "-Wno-shorten-64-to-32",
  "-Wno-implicit-int-conversion",
  "-Wno-double-promotion",
  "-Wno-shadow-field",
  "-Wno-shadow-uncaptured-local",
  "-Wno-implicit-float-conversion",
  "-Wno-switch-enum",
  "-Wno-date-time",
  "-Wno-disabled-macro-expansion",
  "-Wno-sign-compare",
  "-Wno-ms-bitfield-padding",
  "-Wno-unsafe-buffer-usage",
  "-Wno-global-constructors",
  "-Wno-exit-time-destructors",
  "-Wno-padded",
  "-Wno-nrvo",
  "-Wno-c++98-compat",
  "-Wno-c++98-compat-pedantic",
  "-Wno-switch-default",
  "-Wno-four-char-constants",
  "-Wno-weak-vtables",
  "-Wno-multichar",
]

# transcribed: CMAKE_CXX_COMPILER_ID STREQUAL "GNU" branch (Linux gcc; S5
# validates on keres). -Wuseless-cast is _safe upstream; gcc >= 4.8 accepts.
[flags.cfg.gcc]
cxx-flags = [
  "-Wall", "-Wextra", "-Wcast-qual", "-Wfloat-equal",
  "-Wmissing-declarations", "-Wmissing-format-attribute", "-Wno-long-long",
  "-Wpacked", "-Wredundant-decls", "-Wundef", "-Wno-sign-compare",
  "-Wno-multichar", "-Woverloaded-virtual", "-pipe",
  "-Wsuggest-attribute=noreturn", "-Wuseless-cast",
]

# Platform-conditional add_definitions() from compilerDefinitions.cmake.
# There is no cfg-conditional package-scope `defines` home
# ([target-defaults.cfg.*] is reserved), so these ride [flags.cfg.*] exactly
# as upstream's directory-scope definitions do; -D_GLIBCXX_* is the
# ABI-classified case the [flags] scope exists for. (The schema warns that
# -D belongs in `defines` — accepted noise, recorded in GAPS.md.)
#
# transcribed: AppleClang/libc++ branch (non-Debug else-arm): _GLIBCXX_DEBUG
# (no-op on libc++) + _LIBCPP_REMOVE_TRANSITIVE_INCLUDES. Keyed to os=macos,
# not compiler=clang: Linux clang defaults to libstdc++, where upstream's
# Release build defines neither (and adds -U_GLIBCXX_DEBUG for clang —
# unnecessary here because the -D never applies off macOS).
[flags.cfg.macos]
cxx-flags = [
  "-D_GLIBCXX_DEBUG",
  "-D_LIBCPP_REMOVE_TRANSITIVE_INCLUDES",
  "-Wno-poison-system-directories",  # transcribed: AppleClang-only warning
                                     # relaxation; apple-clang predicate is
                                     # reserved, macos is the honest key
]

# transcribed: check_include_file_cxx(execinfo.h HAVE_EXECINFO_H) — true on
# macOS and glibc Linux; KNOWINGLY WRONG on musl (execinfo.h absent there;
# lib/config.h would fall back to __has_include if the define were absent).
[flags.cfg.unix]
cxx-flags = ["-DHAVE_EXECINFO_H=1"]

# ------------------------------------------------------------------
# Upstream USE_BOOST=Auto silently picked up ambient Homebrew Boost
# (header-only boost::container::small_vector swap, perf-only). Declared now:
# system dependency, resolved via find_package(Boost), never built.
[dependencies.boost]
system       = true
find-package = "Boost"

# ------------------------------------------------------------------
# Wave-1 gap #7 ("single ugliest thing"): 4 defines + cxx-std repeated on
# every target -> [target-defaults]. HAVE_BOOST and FILESDIR are upstream
# add_definitions() (every target, externals included). FILESDIR tracks the
# actual install prefix now instead of a hardcoded /usr/local path.
[target-defaults]
cxx-std = 11
defines = { private = ["HAVE_BOOST", 'FILESDIR="${install-prefix}/share/cppcheck"'] }

# ------------------------------------------------------------------
# Vendored externals (upstream wraps each in a tiny add_library).
# Per-target -Wno relaxations were wave-1 gap #4; now real syntax.
[targets.tinyxml2]
type = "static-library"
sources = ["externals/tinyxml2/*.cpp"]
includes = { public = ["externals/tinyxml2"] }

[targets.tinyxml2.cfg.clang]        # transcribed: tinyxml2 CMakeLists clang arm
cxx-flags = [
  "-Wno-implicit-fallthrough", "-Wno-suggest-destructor-override",
  "-Wno-zero-as-null-pointer-constant", "-Wno-format-nonliteral",
  "-Wno-inconsistent-missing-destructor-override", "-Wno-sign-conversion",
  "-Wno-double-promotion",
]

[targets.tinyxml2.cfg.gcc]          # transcribed: tinyxml2 CMakeLists GNU arm
cxx-flags = ["-Wno-suggest-attribute=format", "-Wno-useless-cast"]

[targets.simplecpp]
type = "static-library"
sources = ["externals/simplecpp/*.cpp"]
includes = { public = ["externals/simplecpp"] }

[targets.simplecpp.cfg.clang]       # transcribed: simplecpp CMakeLists clang arm
cxx-flags = ["-Wno-zero-as-null-pointer-constant"]

# ------------------------------------------------------------------
# Upstream: add_library(cppcheck-core OBJECT ...); PUBLIC include ".";
# PRIVATE tinyxml2 simplecpp picojson; SYSTEM PUBLIC Boost includes.
# Private static-lib deps propagate link-only ($<LINK_ONLY:...> parity).
[targets.cppcheck-core]
type = "static-library"
sources = ["lib/*.cpp"]
includes = { public = ["lib"], private = ["externals/picojson"] }
# WORKAROUND (new wave-1 bug, see GAPS.md "install closure over-staging"):
# `cpp-pkg install` closes the staging set over the executable's local dep
# edges and derives headers for every closed-over static library, even
# though none of the libraries is install = true (spec: executables ship a
# self-contained bin/ artifact). lib/precompiled.h and cli/precompiled.h
# then collide at include/precompiled.h. The override (legal negatives in
# public-headers.patterns) dodges the collision so the binary install can
# proceed; remove it when the planner stops staging non-installed libraries.
public-headers = { base = "lib", patterns = ["*.h", "!precompiled.h"] }
dependencies = { public = ["Boost::headers"], private = ["tinyxml2", "simplecpp"] }

[targets.frontend]
type = "static-library"
sources = ["frontend/*.cpp"]
includes = { public = ["frontend"] }
dependencies = { private = ["cppcheck-core"] }

# Upstream's cli library, reproducible at last (wave-1 gap #5):
# file(GLOB *.cpp) minus main.cpp == ["cli/*.cpp", "!cli/main.cpp"].
# The testrunner shares it, exactly like upstream.
[targets.cli]
type = "static-library"
sources = ["cli/*.cpp", "!cli/main.cpp"]
includes = { public = ["cli"], private = ["externals/picojson"] }
# Same install-closure workaround as cppcheck-core (see GAPS.md).
public-headers = { base = "cli", patterns = ["*.h", "!precompiled.h"] }
dependencies = { private = ["cppcheck-core", "frontend", "tinyxml2", "simplecpp"] }

# ------------------------------------------------------------------
# The product. Threads::Threads is upstream's ${CMAKE_THREAD_LIBS_INIT}
# (builtin pseudo-package since wave 1: -pthread on linux, nothing on macos).
# runtime-data replaces stage-data.sh AND upstream's copy_cfg/copy_addons/
# copy_platforms custom targets. remove_unsigned_platforms needs no
# equivalent at this pin: a first draft carried "!*-unsigned.xml" and the
# negative-matched-nothing warning correctly flagged that upstream deleted
# those files — the drift guard working as designed.
[targets.cppcheck]
type = "executable"
sources = ["cli/main.cpp"]
dependencies = ["cppcheck-core", "cli", "tinyxml2", "simplecpp", "Threads::Threads"]
install = true
runtime-data = [
  { from = "cfg",       patterns = ["*.cfg"] },
  { from = "platforms", patterns = ["*.xml"] },
  { from = "addons" },
]

# ------------------------------------------------------------------
# Tests (wave-1 gap #9). testrunner = upstream test/*.cpp + the cli lib
# (shared, not re-globbed). runtime-data is declared HERE TOO: byte-equal
# dedupe makes the double declaration legal, so `cpp-pkg test` (which builds
# only test targets) still stages cfg/platforms beside the runner.
[targets.testrunner]
type = "executable"
test = true
sources = ["test/*.cpp"]
includes = { private = ["externals/picojson"] }
dependencies = ["cppcheck-core", "tinyxml2", "simplecpp", "frontend", "cli", "Threads::Threads"]
runtime-data = [
  { from = "cfg",       patterns = ["*.cfg"] },
  { from = "platforms", patterns = ["*.xml"] },
  { from = "addons" },
]

[targets.testrunner.cfg.clang]      # transcribed: test CMakeLists clang arm
cxx-flags = ["-Wno-dollar-in-identifier-extension"]

[targets.testrunner.cfg.gcc]        # transcribed: test CMakeLists GNU arm
cxx-flags = ["-Wno-useless-cast"]

# NOTE: upstream's clang-13-only per-source relaxation on cli/
# processexecutor.cpp (-Wno-reserved-identifier) is dead vocabulary on
# clang >= 14 and per-source flags remain unsupported — moot here.

# 85 [[targets.testrunner.run]] entries follow at the end of this file:
# upstream REGISTER_TESTS ctest granularity (one invocation per
# REGISTER_TEST fixture, cwd = the staged-data dir, like upstream's
# WORKING_DIRECTORY ${CMAKE_RUNTIME_OUTPUT_DIRECTORY}).

# ------------------------------------------------------------------
# Upstream's 28 cfg-* ctest entries invoke the PRODUCT binary (cppcheck)
# against test/cfg/*.c(pp). A [[run]] entry can only spawn its own target's
# binary, so this one-TU duplicate of the product exists solely to host
# them (recorded as a gap: per-edge "run this other target" is missing).
[targets.cppcheck-cfg-test]
type = "executable"
test = true
sources = ["cli/main.cpp"]
dependencies = ["cppcheck-core", "cli", "tinyxml2", "simplecpp", "Threads::Threads"]
runtime-data = [
  { from = "cfg",       patterns = ["*.cfg"] },
  { from = "platforms", patterns = ["*.xml"] },
  { from = "addons" },
]

# ------------------------------------------------------------------
# Dev-graph helpers (upstream builds these under BUILD_TESTING / marks
# EXCLUDE_FROM_ALL): excluded from the default build, buildable by name.
[targets.test-signalhandler]
type = "executable"
dev = true
sources = ["test/signal/test-signalhandler.cpp", "cli/signalhandler.cpp", "cli/stacktrace.cpp"]
includes = { private = ["cli", "lib"] }

[targets.test-signalhandler.cfg.unix]  # transcribed: GNU|Clang arm; -rdynamic
cxx-flags  = ["-Wno-missing-declarations", "-Wno-missing-prototypes"]
link-flags = ["-rdynamic"]             # for backtrace() symbol names (not AIX)

[targets.test-stacktrace]
type = "executable"
dev = true
sources = ["test/signal/test-stacktrace.cpp", "cli/stacktrace.cpp"]
includes = { private = ["cli", "lib"] }

[targets.test-stacktrace.cfg.unix]
cxx-flags  = ["-Wno-missing-declarations", "-Wno-missing-prototypes"]
link-flags = ["-rdynamic"]

[targets.test-sehwrapper]           # Windows SEH probe; compiles to a stub
type = "executable"                 # main() elsewhere (upstream builds it
dev = true                          # unconditionally too)
sources = ["test/seh/test-sehwrapper.cpp", "cli/sehwrapper.cpp"]
includes = { private = ["cli", "lib"] }

[targets.dmake]                     # upstream: EXCLUDE_FROM_ALL build tool
type = "executable"                 # (regenerates Makefile/testfile lists;
dev = true                          # the run-dmake source-tree write is NOT
sources = ["tools/dmake/dmake.cpp"] # modeled — no [generate] home for it)
dependencies = ["cppcheck-core", "cli", "simplecpp"]

# ------------------------------------------------------------------
# Upstream REGISTER_TESTS: one ctest entry per REGISTER_TEST fixture
# (85 of them at this pin), cwd = the staged-data/build dir, exactly
# like upstream's WORKING_DIRECTORY ${CMAKE_RUNTIME_OUTPUT_DIRECTORY}.

