# Consumption-side experiment: abseil as an ordinary cpp-pkg dependency.
# Exercises the tier-2 probe at scale (217 imported absl::* components).
#
# Wave-2 edition — both wave-1 workarounds are gone:
#  1. The dep key no longer has to equal the CMake package name: the key is
#     "abseil" and `find-package = "absl"` names abslConfig.cmake (wave-1
#     tool-fix batch documents the field; the probe uses it).
#  2. The dep is plain upstream truth: no locally patched clone. Upstream's
#     installed export gives absl::strings a self-edge in
#     INTERFACE_LINK_LIBRARIES; since wave 1 self-link edges are deduped as
#     no-ops (CMake's own semantics), so unpatched 20260526.0 just works
#     and the lockfile is committable from any machine.
schema-version = 1

[package]
name = "abseil-consumer"
version = "0.1.0"

[dependencies.abseil]
git = "https://github.com/abseil/abseil-cpp"
tag = "20260526.0"
find-package = "absl"

[dependencies.abseil.options]
ABSL_ENABLE_INSTALL = "ON"
ABSL_PROPAGATE_CXX_STD = "ON"
ABSL_BUILD_TESTING = "OFF"
BUILD_TESTING = "OFF"
CMAKE_CXX_STANDARD = "17"

[targets.demo]
type = "executable"
sources = ["src/main.cpp"]
cxx-std = 17
dependencies = ["absl::strings", "absl::str_format", "absl::flat_hash_map"]
