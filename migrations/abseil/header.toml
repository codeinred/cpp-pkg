# cpp-pkg port of abseil-cpp 20260526.0 (subset: closure of
# strings + str_format + flat_hash_map) plus a demo executable.
# Everything below the marker line is emitted by gen_toml.py from upstream's
# absl_cc_library calls; edit gen_toml.py, not the generated blocks.
schema-version = 1

[package]
name = "abseil-subset"
version = "20260526.0"

# absl::time's upstream LINKOPTS carry
#   $<$<PLATFORM_ID:Darwin,...>:-Wl,-framework,CoreFoundation>
# cpp-pkg has no per-target link flags, so the framework rides on the
# profile's consumer-wide link-flags instead (GAP: per-target-flags).
[profiles.release]
link-flags = ["-Wl,-framework,CoreFoundation"]

[targets.demo]
type = "executable"
sources = ["demo/main.cpp"]
cxx-std = 17
dependencies = ["strings", "str_format", "flat_hash_map"]

