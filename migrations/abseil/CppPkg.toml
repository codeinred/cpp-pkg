# cpp-pkg port of abseil-cpp 20260526.0 (subset: closure of
# strings + str_format + flat_hash_map) plus a demo executable and the
# gtest suite covering that closure (wave-2 edition: cfg / [flags] /
# [target-defaults] / dev-test markers / install-export used natively).
# Everything below the marker line is emitted by gen_toml.py from upstream's
# absl_cc_library / absl_cc_test calls; edit gen_toml.py, not the generated
# blocks.
schema-version = 1

[package]
name = "abseil-subset"
version = "20260526.0"

[export]
cmake-name = "absl"                 # find_package(absl) keeps working
namespace = "absl"                  # exported targets are absl::strings etc.

# Upstream COPTS (ABSL_DEFAULT_COPTS), per-compiler exactly as upstream
# splits them; transcribed from absl/copts/GENERATED_AbseilCopts.cmake
# (ABSL_LLVM_FLAGS / ABSL_GCC_FLAGS). -DNOMINMAX entries omitted (windows-
# only; -D belongs in `defines`). Per-test deltas (ABSL_TEST_COPTS) are
# emitted per test target by gen_toml.py.
[flags.cfg.clang]                   # transcribed: ABSL_LLVM_FLAGS
cxx-flags = [
  "-Wall", "-Wmost", "-Wextra", "-Wc++98-compat-extra-semi", "-Wcast-qual",
  "-Wconversion", "-Wdeprecated-pragma", "-Wfloat-overflow-conversion",
  "-Wfloat-zero-conversion", "-Wfor-loop-analysis", "-Wformat-security",
  "-Wgnu-redeclared-enum", "-Winfinite-recursion", "-Winvalid-constexpr",
  "-Wliteral-conversion", "-Wmissing-declarations", "-Wnullability-completeness",
  "-Woverlength-strings", "-Wpointer-arith", "-Wself-assign", "-Wshadow-all",
  "-Wshorten-64-to-32", "-Wsign-conversion", "-Wstring-conversion",
  "-Wtautological-overlap-compare", "-Wtautological-unsigned-zero-compare",
  "-Wthread-safety", "-Wundef", "-Wuninitialized", "-Wunreachable-code",
  "-Wunused-comparison", "-Wunused-local-typedefs", "-Wunused-result",
  "-Wvla", "-Wwrite-strings", "-Wno-float-conversion",
  "-Wno-implicit-float-conversion", "-Wno-implicit-int-float-conversion",
  "-Wno-unknown-warning-option", "-Wno-unused-command-line-argument",
]

[flags.cfg.gcc]                     # transcribed: ABSL_GCC_FLAGS
cxx-flags = [
  "-Wall", "-Wextra", "-Wcast-qual", "-Wconversion-null", "-Wformat-security",
  "-Wmissing-declarations", "-Wnon-virtual-dtor", "-Woverlength-strings",
  "-Wpointer-arith", "-Wundef", "-Wunused-local-typedefs", "-Wunused-result",
  "-Wvarargs", "-Wvla", "-Wwrite-strings",
]

# What 93 identical repetitions looked like in wave 1, once:
[target-defaults]
cxx-std = 17
includes = { public = ["."] }
install = true                      # fills the shipped libraries; dev/test
                                    # targets are skipped by eligibility
# Abseil's repo-root include layout: header derivation from includes.public
# ["."] would sweep the whole tree, so use the one total override, written
# once here instead of 93 times.
public-headers = { base = ".", patterns = ["absl/**/*.h", "absl/**/*.inc"] }

[dev-dependencies.googletest]
git = "https://github.com/google/googletest"
tag = "v1.17.0"
find-package = "GTest"

[targets.demo]
type = "executable"
sources = ["demo/main.cpp"]
dependencies = ["strings", "str_format", "flat_hash_map"]
install = false                     # a demo is not a shipped binary

