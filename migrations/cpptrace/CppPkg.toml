schema-version = 1

# Port of jeremy-rifkin/cpptrace v1.0.4 (macOS arm64, Apple clang).
# Replaces the upstream CMake build (573-line CMakeLists.txt + Autoconfig).
# The defines below are the *results* of upstream's cmake/Autoconfig.cmake
# compile-probes on this platform, baked in by hand (see GAPS.md:
# conditional-sources). Ground truth captured from an upstream ninja build:
#   DEFINES = -DCPPTRACE_DEMANGLE_WITH_CXXABI -DCPPTRACE_GET_SYMBOLS_WITH_LIBDWARF
#             -DCPPTRACE_HAS_CXX_EXCEPTION_TYPE -DCPPTRACE_HAS_MACH_VM
#             -DCPPTRACE_STATIC_DEFINE -DCPPTRACE_UNWIND_WITH_EXECINFO
#             -DHAS_ATTRIBUTE_PACKED -DLIBDWARF_STATIC -DNOMINMAX -DPIC
# (LIBDWARF_STATIC and PIC arrive transitively from libdwarf's public defines.)

[package]
name = "cpptrace"
version = "1.0.4"

# Upstream FetchContent-pins libdwarf-lite at exactly this commit (v2.1.0,
# CPPTRACE_LIBDWARF_TAG in cmake/OptionVariables.cmake). libdwarf-lite is
# properly installable: install(EXPORT) publishes the real imported target
# `libdwarf::dwarf` (the in-build aliases libdwarf::dwarf-static/-shared do
# NOT exist in the installed config — see GAPS.md).
#
# ENABLE_DECOMPRESSION=FALSE: upstream builds libdwarf against zstd + zlib
# for compressed-debug-section support. zstd cannot be a declared cpp-pkg dep
# (its CMakeLists.txt lives in build/cmake/ — no subdirectory pointer in v0;
# see GAPS.md dep-provisioning). Compressed debug sections are an ELF-world
# feature; Apple clang emits uncompressed Mach-O debug info, so this is a
# documented scope reduction, not a behavior change for the macOS demo.
[dependencies.libdwarf]
git = "https://github.com/jeremy-rifkin/libdwarf-lite"
rev = "5dfb2cd2aacf2bf473e5bfea79e41289f88b3a5f"

[dependencies.libdwarf.options]
PIC_ALWAYS = "TRUE"            # upstream sets this before FetchContent
BUILD_DWARFDUMP = "FALSE"      # upstream sets this before FetchContent
ENABLE_DECOMPRESSION = "FALSE" # see comment above

# Upstream compiles the library with -fvisibility=hidden,
# -fvisibility-inlines-hidden and -Wall -Wextra -Werror=return-type -Wundef
# on the cpptrace-lib target only. cpp-pkg v0 has no per-target flags, so
# these ride on the profile and reach every project target including the
# demo (harmless here; see GAPS.md per-target-flags).
[profiles.relwithdebinfo]
cxx-flags = [
    "-fvisibility=hidden",
    "-fvisibility-inlines-hidden",
    "-Wall",
    "-Wextra",
    "-Werror=return-type",
    "-Wundef",
]

[targets.cpptrace]
type = "static-library"
sources = ["src/**/*.cpp"]  # resolves to exactly the 45 files upstream lists
# Upstream declares cxx_std_11 as a floor and compiles at the compiler
# default (Apple clang: gnu++17). Pin 17 explicitly.
cxx-std = 17
# gen/include holds version.hpp, pre-generated by pin.sh because cpp-pkg has
# no configure_file equivalent (GAPS.md codegen-escape-hatch). Upstream
# generates it into ${PROJECT_BINARY_DIR}/include and exposes it PUBLIC.
includes = { public = ["include", "gen/include"], private = ["src"] }

[targets.cpptrace.defines]
public = ["CPPTRACE_STATIC_DEFINE"]
private = [
    # autoconfig results (macOS + Apple clang), see header comment
    "CPPTRACE_UNWIND_WITH_EXECINFO",
    "CPPTRACE_GET_SYMBOLS_WITH_LIBDWARF",
    "CPPTRACE_DEMANGLE_WITH_CXXABI",
    "CPPTRACE_HAS_CXX_EXCEPTION_TYPE",
    "CPPTRACE_HAS_MACH_VM",
    "HAS_ATTRIBUTE_PACKED",
    # unconditional upstream define
    "NOMINMAX",
    # NOT defined: CPPTRACE_USE_NESTED_LIBDWARF_HEADER_PATH — libdwarf-lite's
    # install puts libdwarf.h flat in include/ (verified in the store prefix).
]

[targets.cpptrace.dependencies]
# PRIVATE exactly as upstream: consumers must not see libdwarf headers or
# its LIBDWARF_STATIC/PIC defines, but libdwarf.a must reach the final link
# (static-library LINK_ONLY propagation).
private = ["libdwarf::dwarf"]

# Upstream's test/demo.cpp built as a first-class target (upstream builds it
# only under CPPTRACE_BUILD_TESTING, entangled with googletest — see GAPS.md
# testing-story). Build with --config relwithdebinfo so the binary carries -g;
# cpptrace resolves symbols on macOS from the .o debug map (no dSYM needed).
[targets.demo]
type = "executable"
sources = ["test/demo.cpp"]
cxx-std = 17
dependencies = ["cpptrace"]
