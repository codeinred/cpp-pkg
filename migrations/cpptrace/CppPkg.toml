schema-version = 1

# Port of jeremy-rifkin/cpptrace v1.0.4 — wave-2 (post-wave-1-extensions)
# edition. Replaces the upstream CMake build (573-line CMakeLists.txt +
# cmake/Autoconfig.cmake compile probes + test/CMakeLists.txt).
#
# Wave-1 workarounds dissolved here:
#   - version.hpp pre-generated by pin.sh sed  -> [generate.version-header]
#   - macOS-only baked defines                 -> cfg.unix/.macos/.linux
#     transcriptions of upstream's Autoconfig decision tree
#   - profile-smuggled per-target flags        -> target cxx-flags
#   - zstd undeclarable (CMakeLists in subdir) -> subdir = "build/cmake",
#     ENABLE_DECOMPRESSION restored to upstream's effective default TRUE
#   - silent system-zlib leak                  -> declared system dep
#   - gtest-entangled test suite unported      -> [dev-dependencies] +
#     test = true unittest target run by `cpp-pkg test`
#   - library unpublishable                    -> install = true (+ [export]
#     defaults: find_package(cpptrace), cpptrace::cpptrace)

[package]
name = "cpptrace"
version = "1.0.4"

# [export] defaults are exactly upstream's names: cmake-name "cpptrace"
# (find_package(cpptrace)), namespace "cpptrace" -> cpptrace::cpptrace.

# Upstream pins cxx_std_11 as a floor and compiles at the compiler default
# (gnu++17 on both campaign toolchains). Pin 17 explicitly, once, for all
# three targets. (cxx-extensions = true, i.e. gnu++17, is still reserved.)
[target-defaults]
cxx-std = 17

# ------------------------------------------------------------------
# Upstream: configure_file(cmake/in/version-hpp.in
#   ${PROJECT_BINARY_DIR}/include/cpptrace/version.hpp), @ONLY-compatible
# (template only uses @CPPTRACE_VERSION_*@). Version is now stated ONCE
# ([package].version); wave 1 stated it three times (template consts,
# pin.sh sed args, [package]). Output lands at
# ${gen}/include/cpptrace/version.hpp and ships to consumers via the
# public ${gen}/include entry below (header derivation covers ${gen}).
[generate.version-header]
template = "cmake/in/version-hpp.in"
output   = "include/cpptrace/version.hpp"

[generate.version-header.vars]
CPPTRACE_VERSION_MAJOR = "${package.version.major}"
CPPTRACE_VERSION_MINOR = "${package.version.minor}"
CPPTRACE_VERSION_PATCH = "${package.version.patch}"

# ------------------------------------------------------------------
# Upstream FetchContent-pins libdwarf-lite at exactly this commit (v2.1.0,
# CPPTRACE_LIBDWARF_TAG in cmake/OptionVariables.cmake). Its
# install(EXPORT) publishes the real imported target libdwarf::dwarf (the
# in-build aliases libdwarf::dwarf-static/-shared do NOT exist in the
# installed config).
#
# ENABLE_DECOMPRESSION=TRUE is upstream's effective default (libdwarf
# defaults it TRUE and cpptrace does not override): compressed-.debug_*
# support via zlib + zstd. Wave 1 had to set it FALSE — zstd was
# undeclarable (subdir) and zlib resolved silently from the SDK (the
# Homebrew/SDK leak documented in wave-1 GAPS). Both now declared below;
# libdwarf's installed libdwarfConfig.cmake re-runs find_dependency(ZLIB)
# + find_dependency(zstd) (with its bundled Findzstd.cmake), hence needs.
[dependencies.libdwarf]
git   = "https://github.com/jeremy-rifkin/libdwarf-lite"
rev   = "5dfb2cd2aacf2bf473e5bfea79e41289f88b3a5f"
needs = ["zstd", "zlib"]

[dependencies.libdwarf.options]
PIC_ALWAYS           = "TRUE"  # upstream sets this before FetchContent
BUILD_DWARFDUMP      = "FALSE" # upstream sets this before FetchContent
ENABLE_DECOMPRESSION = "TRUE"  # upstream effective default (see above)

# Upstream: FetchContent_Declare(zstd URL ${CPPTRACE_ZSTD_URL}
# SOURCE_SUBDIR build/cmake) — the wave-1 blocker with no workaround
# (zstd's CMakeLists.txt lives in build/cmake/ in repo and tarball alike).
# Same URL upstream pins; cache options exactly upstream's set.
[dependencies.zstd]
url    = "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz"
sha256 = "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3"
subdir = "build/cmake"

[dependencies.zstd.options]
ZSTD_BUILD_PROGRAMS = "OFF"
ZSTD_BUILD_CONTRIB  = "OFF"
ZSTD_BUILD_TESTS    = "OFF"
ZSTD_BUILD_STATIC   = "ON"
ZSTD_BUILD_SHARED   = "OFF"
ZSTD_LEGACY_SUPPORT = "OFF"

# Upstream relies on system zlib ("currently relying on system zlib" —
# CMakeLists.txt comment); libdwarf does find_package(ZLIB). Declared, so
# the resolved SDK/system libz is a hash input instead of a silent leak
# (wave-1 gap 2: /opt/homebrew + SDK paths escaped into store manifests
# with no warning).
[dependencies.zlib]
system       = true
find-package = "ZLIB"
# libdwarf's probe re-runs find_dependency(ZLIB), so ZLIB::ZLIB shows up
# in both probes' output; this settles ownership on the system dep.
exposes-targets = ["ZLIB::ZLIB"]

# ------------------------------------------------------------------
# Upstream test/CMakeLists.txt: FetchContent googletest at exactly this
# commit ("v1.12.1, last to support C++11") unless
# CPPTRACE_USE_EXTERNAL_GTEST. Dev-only: `cpp-pkg build` of the library
# does no store work for it. Installed config is GTestConfig.cmake, hence
# find-package. The pin predates CMake 4's minimum-version floor;
# CMAKE_POLICY_VERSION_MINIMUM is the blessed hint for that refusal.
[dev-dependencies.googletest]
git          = "https://github.com/google/googletest"
rev          = "58d77fa8070e8cec2dc1ed015d66b454c8d78850" # v1.12.1
find-package = "GTest"
options      = { CMAKE_POLICY_VERSION_MINIMUM = "3.5" }

# ==================================================================
# The library. Sources are unconditional on every platform (upstream
# compiles all back-ends everywhere; unselected back-ends are empty TUs) —
# only the DEFINES are platform-dependent, transcribed per-predicate below.
[targets.cpptrace]
type    = "static-library"
sources = ["src/**/*.cpp"] # exactly the 45 files upstream lists by hand
includes = { public = ["include", "${gen}/include"], private = ["src"] }
# Upstream target properties CXX_VISIBILITY_PRESET hidden +
# VISIBILITY_INLINES_HIDDEN, on the library target only (wave 1 smuggled
# these through [profiles.relwithdebinfo], hitting every target).
cxx-flags = { private = ["-fvisibility=hidden", "-fvisibility-inlines-hidden"] }
install = true

[targets.cpptrace.defines]
public  = ["CPPTRACE_STATIC_DEFINE"] # upstream: PUBLIC iff static build
private = ["NOMINMAX"]               # upstream: unconditional PRIVATE

[targets.cpptrace.dependencies]
# PRIVATE exactly as upstream: consumers see no libdwarf headers or its
# LIBDWARF_STATIC/PIC defines, but libdwarf.a (and its zstd/zlib closure)
# reaches the final link via static-library LINK_ONLY propagation.
private = ["libdwarf::dwarf"]

# Upstream warning_options, PRIVATE on the library target only:
# non-MSVC base set, plus two GNU-only members. MSVC (/W4 /permissive-)
# is out of campaign scope — windows branches not written.
[targets.cpptrace.cfg.clang]
cxx-flags = { private = ["-Wall", "-Wextra", "-Werror=return-type", "-Wundef"] }

[targets.cpptrace.cfg.gcc]
cxx-flags = { private = [
    "-Wall", "-Wextra", "-Werror=return-type", "-Wundef",
    "-Wuseless-cast", "-Wmaybe-uninitialized",
] }

# Autoconfig results shared by macOS and Linux (upstream gates: non-MSVC /
# NOT WIN32 / UNIX). Each entry names the upstream check it transcribes.
[targets.cpptrace.cfg.unix]
defines = { private = [
    # transcribed: check_support(HAS_CXXABI) -> CPPTRACE_DEMANGLE_WITH_CXXABI
    #   (cxxabi.h: present under libc++ and libstdc++ alike)
    "CPPTRACE_DEMANGLE_WITH_CXXABI",
    # transcribed: Autoconfig symbols branch `if(UNIX)` -> libdwarf
    "CPPTRACE_GET_SYMBOLS_WITH_LIBDWARF",
    # transcribed: check_support(HAS_CXX_EXCEPTION_TYPE), gated NOT WIN32
    "CPPTRACE_HAS_CXX_EXCEPTION_TYPE",
    # transcribed: check_support(HAS_ATTRIBUTE_PACKED), gated non-MSVC
    "HAS_ATTRIBUTE_PACKED",
] }

[targets.cpptrace.cfg.macos]
defines = { private = [
    # transcribed: Autoconfig unwinding `if(APPLE AND Clang/AppleClang)`
    #   + HAS_EXECINFO -> execinfo.h backtrace()
    "CPPTRACE_UNWIND_WITH_EXECINFO",
    # transcribed: check_support(HAS_MACH_VM), gated APPLE
    "CPPTRACE_HAS_MACH_VM",
] }
# (CMAKE_DL_LIBS is empty on Darwin — dlopen lives in libSystem.)

[targets.cpptrace.cfg.linux]
defines = { private = [
    # transcribed: Autoconfig unwinding `elseif(UNIX)` + HAS_UNWIND ->
    #   libgcc _Unwind_Backtrace
    "CPPTRACE_UNWIND_WITH_UNWIND",
    # transcribed: check_support(HAS_DL_FIND_OBJECT), gated UNIX AND NOT
    #   APPLE. TRUE on glibc >= 2.35 (the S5 box); FALSE on musl and old
    #   glibc, which take the HAS_DLADDR1 fallback instead — a real probe
    #   is the eventual fix, this is the blessed interim transcription.
    "CPPTRACE_HAS_DL_FIND_OBJECT",
] }
# transcribed: `if(UNIX) target_link_libraries(... ${CMAKE_DL_LIBS})` —
# "dl" on Linux (no-op stub since glibc 2.34, still correct to pass).
link-flags = { private = ["-ldl"] }

# ==================================================================
# Upstream builds these only under CPPTRACE_BUILD_TESTING; both get the
# `debug` flag set (-g unconditionally, every config) so traces resolve.

# test/demo.cpp — the wave-1 parity vehicle. A demo, not an asserting
# test (upstream registers no ctest for it), so dev, not test.
[targets.demo]
type         = "executable"
dev          = true
sources      = ["test/demo.cpp"]
dependencies = ["cpptrace"]
cxx-flags    = ["-g"] # upstream `debug` var: tests/demos always carry -g

# The ACTUAL unit suite: upstream test_cpptrace(TEST_NAME unittest) — the
# only add_test() registration. The glob resolves to exactly the 19
# sources upstream lists. gtest_main provides main; gmock linked as
# upstream does. Private src/ include: tests reach into internals.
[targets.unittest]
type         = "executable"
test         = true
sources      = ["test/unit/**/*.cpp"]
includes     = ["src"]
dependencies = ["cpptrace", "GTest::gtest_main", "GTest::gmock_main"]
cxx-flags = [
    "-g",
    # warning_options as applied to tests (non-MSVC), incl. the two
    # test-only suppressions upstream adds for gtest macros:
    "-Wall", "-Wextra", "-Werror=return-type", "-Wundef",
    "-Wno-pedantic", "-Wno-attributes",
]

[targets.unittest.cfg.gcc]
# transcribed: test/CMakeLists.txt appends $<CXX_COMPILER_ID:GNU>:
#   -Wno-infinite-recursion to warning_options
cxx-flags = ["-Wno-infinite-recursion"]
