schema-version = 1

# json-tui v1.4.2 (https://github.com/ArthurSonzogni/json-tui) migrated from
# CMake+FetchContent to cpp-pkg — wave-2 edition, using the wave-1 extensions
# natively. Upstream pulls ftxui, nlohmann_json, args and (tests-only)
# googletest via FetchContent; here the first three are [dependencies] and
# googletest is a [dev-dependencies] entry reached only by the test target.

[package]
name = "json-tui"
version = "1.4.2"

# ------------------------------------------------------------------
# Upstream: configure_file(src/version.hpp.in -> ${BINARY_DIR}/src/version.hpp)
# substituting @CMAKE_PROJECT_VERSION@. Was: pin.sh pre-generating gen/src/
# with sed (version string stated three times). Now a tier-a template step;
# the version is stated once, in [package].version, and both consumers
# reference ${gen}/src.
[generate.version-header]
template = "src/version.hpp.in"
output   = "src/version.hpp"          # lands at ${gen}/src/version.hpp
vars     = { CMAKE_PROJECT_VERSION = "${package.version}" }

# ------------------------------------------------------------------
# Upstream's add_definitions(-DJSON_NOEXCEPTION) is directory-scoped and hits
# all three targets as a direct compile definition; a target-default private
# define is the exact translation (wave 1 modeled it as a PUBLIC define on
# the lib, which reached the same TUs but via propagation upstream does not
# use). cxx-std: target_compile_features(... cxx_std_17) on lib and exe;
# tests overrides with 20 (scalar defaults fill-if-absent, target wins).
[target-defaults]
cxx-std = 17
defines = { private = ["JSON_NOEXCEPTION"] }

# ------------------------------------------------------------------
[dependencies.ftxui]
git = "https://github.com/ArthurSonzogni/ftxui"
tag = "v7.0.0"
# Same pin as upstream's FetchContent_Declare(ftxui GIT_TAG v7.0.0).
# Store manifest exports: ftxui::screen, ftxui::dom, ftxui::component (plus
# an aggregate ftxui::ftxui, unused here; upstream links the components).
# Wave 1 needed `exposes-targets = ["Threads::Threads"]` here to break the
# ftxui/googletest ownership ambiguity; Threads::Threads is now a builtin
# (ladder step 0) and the line is deleted — claiming it is a hard error.
[dependencies.ftxui.options]
FTXUI_BUILD_EXAMPLES = "OFF"
FTXUI_BUILD_DOCS = "OFF"
FTXUI_BUILD_TESTS = "OFF"
FTXUI_ENABLE_INSTALL = "ON"

# Upstream's exact release asset. Wave 1 had to substitute the GitHub tag
# tarball (~180MB unpacked full repo) because .tar.xz was rejected; the
# fetch whitelist now accepts .tar.xz/.tar.bz2, so provenance is restored
# (112KB trimmed asset, upstream's own URL).
[dependencies.nlohmann_json]
url = "https://github.com/nlohmann/json/releases/download/v3.12.0/json.tar.xz"
sha256 = "42f6e95cad6ec532fd372391373363b62a14af6d771056dbfc86160e6dfff7aa"
options = { JSON_BuildTests = "OFF", JSON_Install = "ON" }

# Upstream pin: FetchContent_Declare(args GIT_TAG 114200a9...). Exports
# taywee::args. Wave 1 was forced to the commit tarball because the
# submodule guard false-positived on this commit's 0-byte .gitmodules; the
# guard now triggers on actual gitlink entries, so the git+rev pin —
# upstream's own spelling — works.
[dependencies.args]
git = "https://github.com/Taywee/args"
rev = "114200a9ad5fe06c8dea76e15d92325695cf3e34"
options = { ARGS_BUILD_EXAMPLE = "OFF", ARGS_BUILD_UNITTESTS = "OFF" }

# ------------------------------------------------------------------
# Test-only, exactly as upstream (cmake/test.cmake, fetched only when
# JSON_TUI_BUILD_TESTS=ON). Wave 1 had this in [dependencies]: every
# app-only build fetched and built googletest. Now `cpp-pkg build` does no
# store work for it; only `cpp-pkg build tests` / `cpp-pkg test` provision it.
# The pinned 2021 commit predates CMake 4's minimum-version floor, hence the
# CMAKE_POLICY_VERSION_MINIMUM option (upstream's CMake build needs the same
# flag). BUILD_GMOCK=OFF mirrors upstream's cache setting; upstream's
# INSTALL_GTEST=OFF is deliberately NOT mirrored — the store probe consumes
# the installed GTestConfig.cmake.
[dev-dependencies.googletest]
git = "https://github.com/google/googletest"
rev = "23ef29555ef4789f555f1ba8c51b4c52975f0907"
find-package = "GTest"                # installed config is GTestConfig.cmake
options = { BUILD_GMOCK = "OFF", CMAKE_POLICY_VERSION_MINIMUM = "3.5" }

# ------------------------------------------------------------------
# Targets. Upstream: add_library(json-tui-lib) + add_executable(json-tui)
# + add_executable(tests) (tests only under JSON_TUI_BUILD_TESTS=ON).
#
# Flags are now upstream's structure line for line (wave 1 smuggled them
# through duplicated [profiles.release]/[profiles.debug] stanzas, hitting
# every consumer target including tests — which broke on gtest headers and
# needed -Wno-error=character-conversion; both stanzas and the suppression
# are deleted, and dep headers now arrive -isystem as CMake's imported
# targets do):
#   - warning set: PRIVATE on json-tui-lib and json-tui, gated upstream by
#     `if (NOT WIN32)` -> cfg.unix, and absent from tests (upstream shields
#     it from -Werror);
#   - -fno-exceptions: PUBLIC on json-tui-lib, unconditional (outside the
#     WIN32 guard) — propagates to json-tui and tests exactly as upstream's
#     target_compile_options(json-tui-lib PUBLIC -fno-exceptions).

[targets.json-tui-lib]
type = "static-library"
sources = [
  "src/button.cpp",
  "src/expander.cpp",
  "src/main_ui.cpp",
  "src/keybinding.cpp",
  "src/mytoggle.cpp",
]
includes = { private = ["src", "${gen}/src"] }
cxx-flags = { public = ["-fno-exceptions"] }
dependencies = { private = [
  "ftxui::screen",
  "ftxui::dom",
  "ftxui::component",
], public = [
  "nlohmann_json::nlohmann_json",
] }

[targets.json-tui-lib.cfg.unix]       # transcribed: if (NOT WIN32)
cxx-flags = { private = [
  "-Wall", "-Wextra", "-pedantic", "-Werror",
  "-Wmissing-declarations", "-Wshadow",
] }

[targets.json-tui]
type = "executable"
sources = ["src/main.cpp"]
includes = { private = ["src", "${gen}/src"] }
dependencies = ["json-tui-lib", "taywee::args"]
# Upstream: install(TARGETS json-tui RUNTIME DESTINATION bin). CPack
# packaging remains out of scope (DESTDIR is the packager interface).
install = true

[targets.json-tui.cfg.unix]           # transcribed: if (NOT WIN32)
cxx-flags = { private = [
  "-Wall", "-Wextra", "-pedantic", "-Werror",
  "-Wmissing-declarations", "-Wshadow",
] }

# Upstream builds this only when -DJSON_TUI_BUILD_TESTS=ON and registers it
# with CTest via gtest_discover_tests. test = true (implies dev) removes it
# from the default build and registers it with `cpp-pkg test`; zero [[run]]
# entries = one default invocation, which runs the whole gtest binary
# (4 cases). Per-case discovery has no cpp-pkg analogue (recorded in GAPS).
[targets.tests]
type = "executable"
test = true
sources = ["src/expander_test.cpp"]
cxx-std = 20
includes = { private = ["src"] }
dependencies = ["json-tui-lib", "GTest::gtest_main"]
