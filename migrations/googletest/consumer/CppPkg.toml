# Ecosystem test: consume googletest as a normal cpp-pkg GIT dependency.
# Upstream's CMake build installs GTestConfig.cmake exporting GTest::gtest,
# GTest::gtest_main, GTest::gmock, GTest::gmock_main (tier-2 probe).

schema-version = 1

[package]
name = "gtest-consumer"
version = "0.1.0"

[dependencies.googletest]
git = "https://github.com/google/googletest"
tag = "v1.18.0"
# Upstream installs GTestConfig.cmake, so the probe must call
# find_package(GTest), not find_package(googletest). NOTE: `find-package`
# exists in the implementation (src/schema.rs) but is absent from
# CPPKG_TOML.md — see GAPS.md.
find-package = "GTest"
# Dep key "googletest" != exported namespace "GTest::"; single-dep projects
# resolve by uniqueness (ladder step 1), but declare ownership explicitly.
exposes-namespace = ["GTest"]

[targets.calc_test]
type = "executable"
sources = ["test/calc_test.cc"]
cxx-std = 17
dependencies = ["GTest::gmock", "GTest::gtest_main"]
