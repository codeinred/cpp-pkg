# cpp-pkg migration of google/benchmark v1.9.5 (build-from-source mode),
# wave-2 edition: uses the wave-1 extensions natively. Staged into the root
# of the upstream checkout by pin.sh (together with CppPkg.lock).
#
# Reference for every transcription: fresh CMake configure of the same
# checkout with -DCMAKE_BUILD_TYPE=Release -DBENCHMARK_DOWNLOAD_DEPENDENCIES=ON
# (testing ON — the suite is in scope now; wave 1 compared against testing
# OFF, whose only flag difference is upstream adding -Wsuggest-override).
#
# This file is GENERATED by a throwaway script from upstream's
# test/CMakeLists.txt transcription; edit it directly, it is the source of
# truth (the generator was scratch).

schema-version = 1

[package]
name = "benchmark"
version = "1.9.5"

# Upstream: find_package name "benchmark", namespace "benchmark::" — both
# equal the package name, so these are the defaults; spelled out to record
# that the choice was checked against upstream, not defaulted by accident.
[export]
cmake-name = "benchmark"
namespace  = "benchmark"

# ---------------------------------------------------------------------------
# Upstream puts its warning battery + visibility preset in CMAKE_CXX_FLAGS
# (directory-global, every target incl. tests). Wave 1 smuggled this through
# duplicated [profiles.release]/[profiles.debug] stanzas; both are deleted.
# [flags] is the exact home: every target, every profile, consumer-only.
#
# Split: members both gcc and clang accept stay unconditional; the two
# clang-only members go under cfg.clang (upstream probes each flag with
# add_cxx_compiler_flag, so gcc simply never gets them — with -Werror in the
# same battery, one unconditional block would hard-break gcc builds).
# -Wsuggest-override is deliberately ABSENT: upstream adds it only when
# BENCHMARK_ENABLE_TESTING=OFF (gtest doesn't use `override`), and this
# manifest carries the test suite.
[flags]
cxx-flags = [
  "-Wall", "-Wextra", "-Wshadow", "-Wfloat-equal", "-Wold-style-cast",
  "-Wconversion", "-Wformat=2", "-Werror",
  "-pedantic", "-pedantic-errors",
  "-fstrict-aliasing", "-Wstrict-aliasing",
  "-Wno-deprecated-declarations", "-Wno-deprecated",
  # CMAKE_CXX_VISIBILITY_PRESET=hidden / VISIBILITY_INLINES_HIDDEN=ON:
  "-fvisibility=hidden", "-fvisibility-inlines-hidden",
]

[flags.cfg.clang]                     # transcribed: add_cxx_compiler_flag
cxx-flags = ["-Wshorten-64-to-32", "-Wthread-safety"]

# ---------------------------------------------------------------------------
# Test-only dependency (wave 1: inexpressible; declaring gtest would have
# poisoned the production closure — the suite was cut instead). Pin =
# upstream's own bundled-gtest pin (cmake/GoogleTest.cmake.in GIT_TAG
# v1.15.2). BUILD_GMOCK defaults ON (tests link GTest::gmock_main);
# INSTALL_GTEST defaults ON (the store probe consumes GTestConfig.cmake,
# hence find-package = "GTest").
[dev-dependencies.googletest]
git = "https://github.com/google/googletest"
tag = "v1.15.2"
find-package = "GTest"

# ---------------------------------------------------------------------------
# Directory-global facts (upstream top-level CMakeLists), filled into every
# target:
#   - CMAKE_CXX_STANDARD 17 (cxx11_test overrides to 11: scalar defaults
#     fill-if-absent, target wins);
#   - large-file defines, non-MSVC branch (add_definitions);
#   - HAVE_STD_REGEX / HAVE_STEADY_CLOCK: cxx_feature_check try_run results,
#     added via add_compile_definitions (global — test TUs include src/re.h
#     and src/timers.h and must see the same backend selection).
#     transcribed: cxx_feature_check(STD_REGEX) = TRUE and
#     cxx_feature_check(STEADY_CLOCK) = TRUE on macOS/AppleClang 21; both
#     are equally TRUE on linux-glibc and windows-msvc, so they sit here
#     unconditionally rather than under cfg (the third probe,
#     THREAD_SAFETY_ATTRIBUTES, is compiler-conditional — see the cfg.clang
#     blocks on targets below).
#   - install = true: eligibility skips every dev/test target automatically,
#     so exactly benchmark + benchmark_main export (upstream's
#     targets_to_export list).
[target-defaults]
cxx-std = 17
defines = { private = [
  "_FILE_OFFSET_BITS=64", "_LARGEFILE64_SOURCE", "_LARGEFILE_SOURCE",
  "HAVE_STD_REGEX",     # transcribed: cxx_feature_check(STD_REGEX)
  "HAVE_STEADY_CLOCK",  # transcribed: cxx_feature_check(STEADY_CLOCK)
] }
install = true

# ---------------------------------------------------------------------------
# The benchmark library. Sources are upstream's own shape at last:
# file(GLOB *.cc) minus benchmark_main.cc (wave 1: 19 files by hand; a new
# upstream file was a silent link error, now it's picked up by the glob).
[targets.benchmark]
type = "static-library"
sources = ["src/*.cc", "!src/benchmark_main.cc"]
includes = { public = ["include"], private = ["src"] }
# Upstream links Threads::Threads PRIVATE (wave 1 dropped the edge — correct
# on macOS only, where pthreads live in libSystem). Builtin pseudo-package:
# expands to -pthread on linux compile+link, nothing on macos/windows.
dependencies = { private = ["Threads::Threads"] }

[targets.benchmark.defines]
# PUBLIC upstream when BUILD_SHARED_LIBS is off (propagates to all consumers
# and into the installed config).
public = ["BENCHMARK_STATIC_DEFINE"]
# BENCHMARK_VERSION: upstream = `git describe` at configure time, attached to
# benchmark.cc only via a per-SOURCE property. Wave 1 hardcoded "v1.9.5"
# (silent drift if the pin moved; git describe can't even run in the store,
# which strips .git). Now interpolated — stated once, in [package].version.
# Still target-private rather than per-source (only benchmark.cc consumes it,
# via #ifdef, so object code is identical).
private = ['BENCHMARK_VERSION="v${package.version}"']

[targets.benchmark.cfg.clang]
# transcribed: cxx_feature_check(THREAD_SAFETY_ATTRIBUTES), gated upstream on
# HAVE_CXX_FLAG_WTHREAD_SAFETY (clang-only; the attributes are clang
# vocabulary, defining this under gcc would -Werror on unknown attributes).
defines = { private = ["HAVE_THREAD_SAFETY_ATTRIBUTES"] }

[targets.benchmark.cfg.linux]
# transcribed: cxx_feature_check(PTHREAD_AFFINITY) — pthread_setaffinity_np
# exists on linux-glibc; FALSE on macOS (verified in the reference
# CMakeCache). Upstream turns the probe into a benchmark-target-private
# define.
defines = { private = ["BENCHMARK_HAS_PTHREAD_AFFINITY"] }
# transcribed: check_library_exists(rt shm_open) — TRUE on linux-glibc,
# empty on macOS. Emitted after libbenchmark.a in the interleaved link
# closure, so it survives --as-needed.
link-flags = ["-lrt"]

[targets.benchmark.cfg.windows]
# transcribed: CMAKE_SYSTEM_NAME MATCHES "Windows" -> shlwapi (MSVC
# spelling; accepted-but-false on this campaign's platforms, validated but
# never expanded). Solaris kstat has no cfg atom — out of vocabulary,
# recorded in GAPS.md.
link-flags = ["shlwapi.lib"]

# ---------------------------------------------------------------------------
# benchmark_main: one TU providing main(), PUBLIC dep on benchmark.
#
# The public include dir is NOT redundant: benchmark_main has no headers of
# its own, and exporting a library with an empty header derivation is a hard
# error. Upstream's install(TARGETS benchmark benchmark_main ... INCLUDES
# DESTINATION include) puts include/ on BOTH exported targets' interface, so
# this is the faithful spelling; the derived benchmark/*.h files are
# byte-identical to the ones benchmark installs and dedupe.
[targets.benchmark_main]
type = "static-library"
sources = ["src/benchmark_main.cc"]
includes = { public = ["include"] }
dependencies = { public = ["benchmark"] }

# ===========================================================================
# Test suite — upstream test/CMakeLists.txt, transcribed 1:1 for the
# configuration the reference build produced (Release; gtest tests ON;
# assembly tests OFF — arm64, upstream gates them on x86_64+FileCheck).
#
# Directory-scope facts shared by every test target (upstream applies them
# to the whole test/ dir; [target-defaults] cannot hold flags and
# [target-defaults.cfg.*] is reserved, so they repeat per target — see
# GAPS.md "Remaining"):
#   - add_cxx_compiler_flag(-Wno-unused-variable)
#   - non-Debug branch: add_definitions(-UNDEBUG) — scrubs the profile's
#     -DNDEBUG via documented last-wins layering; no schema home for an
#     un-define, so it rides in cxx-flags (draws the documented lint
#     warning naming `defines`, by design) — plus
#     -DTEST_BENCHMARK_LIBRARY_HAS_NO_ASSERTIONS. This transcribes the
#     RELEASE branch; a debug-config test build would keep assertions
#     upstream, which cfg cannot express (profile-conditional, not
#     platform — recorded in GAPS.md).
#   - HAVE_THREAD_SAFETY_ATTRIBUTES under cfg.clang: upstream's probe define
#     is global, and several test TUs include src/mutex.h transitively.
#   - BENCHMARK_STATIC_DEFINE arrives via benchmark's public defines
#     (upstream re-add_definitions it redundantly).
# ===========================================================================

# Static helper library for the output-checking tests
# (self-verifying: the binary matches its own output against
# expectations compiled in via output_test.h). dev = true:
# dev-graph membership without registering as a test.
[targets.output_test_helper]
type = "static-library"
dev = true
sources = ["test/output_test_helper.cc"]
dependencies = { private = ["benchmark"] }
cxx-flags = { private = ["-Wno-unused-variable", "-UNDEBUG"] }
defines = { private = ["TEST_BENCHMARK_LIBRARY_HAS_NO_ASSERTIONS"] }
[targets.output_test_helper.cfg.clang]
defines = { private = ["HAVE_THREAD_SAFETY_ATTRIBUTES"] }

